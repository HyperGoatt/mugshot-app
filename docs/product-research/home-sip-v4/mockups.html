<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mugshot Home Sip V4 — screen renderer</title>
  <style>
    :root { --cream:#FAF6F0; --white:#fff; --ink:#1F1712; --brown:#5B4636; --sage:#6E8F7C; --sage-dark:#4D6F5D; --sage-wash:#ECF2ED; --line:#E3DED4; --sand:#EEE6D8; --muted:#8C8176; --pumpkin:#BE764B; }
    * { box-sizing:border-box; }
    html,body { margin:0; padding:0; width:390px; height:844px; overflow:hidden; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif; color:var(--ink); background:var(--cream); }
    button,input,textarea { font:inherit; }
    .screen { position:relative; width:390px; height:844px; overflow:hidden; background:var(--cream); }
    .status { height:51px; display:flex; align-items:flex-start; justify-content:space-between; padding:12px 27px 0; font-size:15px; line-height:20px; font-weight:700; letter-spacing:-.2px; }
    .status-right { display:flex; gap:6px; align-items:center; font-size:12px; }
    .signal { letter-spacing:-2px; font-size:13px; }
    .battery { padding:1px 4px; border-radius:4px; background:#70B47E; color:white; font-size:11px; }
    .top { height:53px; padding:0 20px; display:flex; align-items:center; justify-content:space-between; }
    .round { width:35px; height:35px; border:1px solid var(--line); border-radius:50%; display:grid; place-items:center; background:white; font-size:21px; line-height:1; font-weight:300; }
    .back { display:flex; align-items:center; gap:8px; color:var(--sage-dark); font-size:14px; font-weight:600; }
    .back .round { font-size:25px; color:var(--ink); }
    .progress { min-width:48px; height:35px; padding:0 8px; border:1px solid var(--line); background:#fffaf5; color:var(--sage-dark); display:grid; place-items:center; border-radius:50px; font-size:12px; font-weight:700; }
    .overline { color:var(--sage-dark); font-size:10px; font-weight:800; letter-spacing:1.25px; text-transform:uppercase; }
    h1,h2,h3,p { margin:0; }
    h1,h2,.serif { font-family:ui-serif,"New York",Georgia,serif; font-weight:400; letter-spacing:-1.25px; }
    h1 { font-size:31px; line-height:1.04; }
    h2 { font-size:26px; line-height:1.06; }
    h3 { font-size:18px; font-weight:700; letter-spacing:-.25px; }
    .small { font-size:12px; color:var(--muted); line-height:1.35; }
    .body { position:absolute; left:0; right:0; top:104px; bottom:92px; overflow:hidden; padding:0 20px 18px; }
    .body.no-footer { bottom:31px; }
    .body.tab-body { bottom:82px; }
    .body.tall { top:94px; }
    .body.with-seg { top:195px; }
    .headline { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:7px 0 17px; }
    .headline .meta { color:var(--sage-dark); font-size:11px; font-weight:700; white-space:nowrap; }
    .subtitle { color:var(--brown); font-size:13px; line-height:1.45; margin:6px 0 15px; }
    .section { margin:19px 0 9px; display:flex; justify-content:space-between; align-items:center; }
    .section-label { font-size:14px; font-weight:750; }
    .section-link { font-size:12px; color:var(--sage-dark); font-weight:700; }
    .card { background:#fff; border:1px solid var(--line); border-radius:17px; box-shadow:0 2px 7px rgba(52,36,24,.035); overflow:hidden; }
    .card.pad { padding:15px; }
    .card.muted { background:#F4F2EB; }
    .card.sage { background:var(--sage-wash); border-color:#C7D4C8; }
    .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 15px; min-height:61px; }
    .row + .row { border-top:1px solid var(--line); }
    .row.tight { padding:10px 14px; min-height:50px; }
    .row-title { font-size:14px; font-weight:700; letter-spacing:-.15px; }
    .row-sub { font-size:11px; color:var(--muted); margin-top:3px; line-height:1.25; }
    .row-end { color:var(--sage-dark); font-size:12px; font-weight:700; white-space:nowrap; }
    .chev { font-size:23px; font-weight:200; color:var(--sage-dark); line-height:1; }
    .pill { border-radius:100px; padding:7px 11px; border:1px solid var(--line); background:#fff; font-size:11px; color:var(--brown); font-weight:650; white-space:nowrap; }
    .pill.active { background:var(--sage); border-color:var(--sage); color:#fff; }
    .pill.soft { background:var(--sage-wash); border-color:var(--sage-wash); color:var(--sage-dark); }
    .pill.amber { background:#F8ECE3; border-color:#F1D9C6; color:#98643F; }
    .pills { display:flex; gap:7px; flex-wrap:wrap; }
    .seg { display:flex; margin:10px 20px 0; padding:4px; border-radius:100px; background:#EFEADF; height:43px; }
    .seg div { flex:1; display:grid; place-items:center; border-radius:100px; color:#887A6D; font-size:13px; font-weight:650; }
    .seg div.selected { background:#fff; color:var(--ink); box-shadow:0 1px 4px rgba(52,36,24,.045); }
    .footer { position:absolute; left:0; right:0; bottom:0; height:92px; padding:11px 20px 22px; background:linear-gradient(0deg,var(--cream) 81%,rgba(250,246,240,.96)); border-top:1px solid rgba(227,222,212,.65); }
    .primary { width:100%; height:51px; display:grid; place-items:center; background:var(--sage); border-radius:18px; color:#fff; font-weight:700; font-size:15px; letter-spacing:-.1px; }
    .primary.cream { background:#EEE6D8; color:var(--ink); }
    .footer-sub { margin-top:8px; text-align:center; color:var(--sage-dark); font-size:11px; font-weight:700; }
    .tabbar { position:absolute; bottom:0; left:0; right:0; height:79px; display:flex; justify-content:space-around; align-items:center; padding-bottom:13px; background:rgba(255,255,255,.94); border-top:1px solid var(--line); }
    .tab { font-size:10px; color:var(--muted); text-align:center; min-width:52px; }
    .tab b { display:block; font-size:20px; line-height:24px; font-weight:400; }
    .tab.on { color:var(--sage-dark); font-weight:750; }
    .tab.add { width:42px; height:42px; min-width:42px; border-radius:50%; box-shadow:0 3px 10px rgba(66,54,44,.11); border:1px solid var(--line); background:#fff; display:grid; place-items:center; font-size:25px; color:var(--brown); }
    .field { background:#fff; border:1px solid var(--line); border-radius:13px; min-height:44px; padding:12px 13px; font-size:14px; margin-top:7px; }
    .field.large { height:118px; color:var(--brown); line-height:1.45; }
    .label { font-size:11px; font-weight:750; color:var(--brown); margin:13px 0 0; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .three { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .mini-stat { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px 9px; text-align:center; }
    .mini-stat b { display:block; font-size:17px; margin:5px 0 2px; }
    .mini-stat span { font-size:10px; color:var(--muted); }
    .photo { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-wide { width:100%; height:187px; object-fit:cover; border-radius:16px; }
    .photo-square { width:66px; height:66px; object-fit:cover; border-radius:12px; }
    .recent-strip { display:flex; gap:10px; width:370px; overflow:hidden; }
    .recent { width:142px; flex:0 0 142px; overflow:hidden; border:1px solid var(--line); background:#fff; border-radius:16px; }
    .recent img { width:100%; height:95px; object-fit:cover; display:block; }
    .recent .copy { padding:9px 10px; }
    .recent b { display:block; font-size:12px; line-height:1.1; }
    .recent small { display:block; color:var(--muted); margin-top:4px; font-size:10px; }
    .component { display:flex; align-items:center; gap:11px; padding:12px 13px; }
    .component + .component { border-top:1px solid var(--line); }
    .component-badge { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; background:#EAF0EB; color:var(--sage-dark); font-size:10px; font-weight:800; letter-spacing:.3px; flex:0 0 38px; }
    .component-badge.pumpkin { background:#FAEEE3; color:#A56237; }
    .component-badge.espresso { background:#EDE6DC; color:#604833; }
    .component .name { flex:1; font-size:13px; font-weight:700; }
    .component .amount { font-size:11px; color:var(--muted); margin-top:3px; }
    .mugsy-card { display:flex; align-items:center; gap:5px; background:#EDF1E9; border-radius:17px; padding:7px 12px 8px 0; min-height:68px; }
    .mugsy-card img { width:73px; height:61px; object-fit:contain; flex:0 0 73px; }
    .mugsy-card .say { font-family:ui-serif,"New York",Georgia,serif; font-size:15px; line-height:1.18; }
    .mugsy-card .sub { font-size:10px; color:var(--sage-dark); margin-top:4px; }
    .numbers { display:flex; gap:7px; }
    .number { background:#F8F6F1; border:1px solid var(--line); border-radius:12px; padding:9px 7px; flex:1; text-align:center; }
    .number small { display:block; font-size:10px; color:var(--muted); }
    .number strong { display:block; font-size:17px; margin-top:3px; }
    .actual { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; gap:8px; min-height:54px; }
    .actual + .actual { border-top:1px solid var(--line); }
    .actual .what { font-size:12px; font-weight:750; }
    .actual .planned { font-size:10px; color:var(--muted); margin-top:3px; }
    .actual .value { min-width:78px; text-align:center; padding:7px 8px; background:#F7F4EF; border:1px solid var(--line); border-radius:10px; font-size:12px; font-weight:700; }
    .actual .value.done { color:var(--sage-dark); background:#EAF1EA; border-color:#D6E4D8; }
    .actual .value.edit { color:var(--ink); background:#fff; border-color:#C6CFC5; }
    .stars { letter-spacing:3px; color:var(--sage); font-size:29px; line-height:1.2; }
    .divider { height:1px; background:var(--line); margin:12px 0; }
    .float-chip { padding:7px 10px; background:#fff; border:1px solid var(--line); border-radius:30px; font-size:11px; font-weight:650; color:var(--brown); }
    .check { width:19px; height:19px; background:var(--sage); border-radius:50%; color:white; display:grid; place-items:center; font-size:12px; flex:0 0 19px; }
    .toggle { width:35px; height:21px; border-radius:20px; background:var(--sage); padding:3px; }
    .toggle:after { content:""; display:block; width:15px; height:15px; background:white; border-radius:50%; margin-left:14px; }
    .sheet-shadow { position:absolute; inset:0; background:rgba(31,23,18,.26); }
    .sheet { position:absolute; left:0; right:0; bottom:0; height:630px; background:var(--cream); border-radius:27px 27px 0 0; padding:11px 20px 29px; box-shadow:0 -6px 30px rgba(31,23,18,.1); }
    .handle { width:36px; height:5px; border-radius:20px; background:#CEC6BC; margin:0 auto 19px; }
    .footnote { font-size:10px; line-height:1.35; color:var(--muted); text-align:center; }
    .tag { font-size:9px; text-transform:uppercase; letter-spacing:.8px; font-weight:800; color:var(--sage-dark); }
    .dotted { border:1px dashed #CFC8BC; border-radius:16px; background:#fff; }
    /* V4 parity pass: these states reuse the real Cafe reflection and Review grammar. */
    .parity-scroll { position:absolute; top:108px; bottom:91px; left:0; right:0; overflow-y:auto; padding:0 20px 24px; scrollbar-width:none; }
    .parity-scroll::-webkit-scrollbar { display:none; }
    .navcapsule { height:35px; min-width:96px; border-radius:22px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:space-around; box-shadow:0 2px 6px #4D3B2D0A; }
    .navcapsule span { font-size:24px; font-weight:300; line-height:1; }
    .parity-header { padding:1px 0 10px; }
    .parity-header h1 { font-size:31px; }
    .parity-header .subtitle { color:#988C80; margin:5px 0 12px; font-size:12px; }
    .parity-summary { display:flex; align-items:center; gap:11px; padding:9px; min-height:74px; margin-bottom:11px; }
    .parity-summary img { width:55px; height:55px; border-radius:10px; object-fit:cover; }
    .parity-summary .name { font-size:13px; font-weight:700; }
    .parity-summary .secondary { font-size:11px; color:var(--muted); margin-top:3px; }
    .parity-summary .edit { margin-left:auto; color:var(--sage-dark); font-size:11px; font-weight:700; padding-right:5px; }
    .parity-coach { background:#EEF0E9; border-radius:16px; padding:12px 11px; height:130px; display:flex; gap:5px; align-items:center; margin-bottom:16px; }
    .parity-coach img { width:103px; height:106px; object-fit:contain; flex:0 0 103px; }
    .parity-coach .speech { background:#fff; border:1px solid #B6D1C0; border-radius:17px; padding:12px 11px; flex:1; }
    .parity-coach .speech b { font-family:ui-serif,Georgia,serif; font-size:16px; }
    .parity-coach .speech p { font-size:10px; color:var(--brown); line-height:1.35; margin-top:4px; }
    .parity-score { margin:5px 0 13px; }
    .parity-score .head { display:flex; align-items:end; justify-content:space-between; }
    .parity-score .head b { font-size:14px; }
    .parity-score .head span { font-family:ui-serif,Georgia,serif; font-size:30px; }
    .parity-score .desc { font-size:11px; color:var(--brown); margin:2px 0 6px; }
    .parity-score .stars { color:#A8D2B8; font-size:26px; line-height:1; letter-spacing:1px; }
    .parity-score .from { color:var(--sage-dark); font-size:10px; font-weight:700; margin-top:2px; }
    .parity-criterion-header { display:flex; justify-content:space-between; align-items:center; margin-top:16px; }
    .parity-criterion-header b { font-size:15px; }
    .parity-criterion-header span { color:var(--sage-dark); font-size:10px; font-weight:700; }
    .parity-subtitle { color:var(--brown); font-size:11px; margin-top:3px; }
    .parity-suggest-label { display:flex; justify-content:space-between; margin:10px 0 6px; font-size:10px; font-weight:700; color:var(--brown); }
    .parity-suggest-label span:last-child { color:var(--sage-dark); }
    .parity-chips { display:flex; gap:7px; width:370px; overflow:hidden; white-space:nowrap; margin-bottom:10px; }
    .parity-chip { height:33px; padding:0 10px; display:inline-flex; gap:6px; align-items:center; border:1px solid var(--line); background:#fff; border-radius:22px; font-size:10px; font-weight:700; flex:0 0 auto; }
    .parity-chip.on { background:#AFC3B4; border-color:#AFC3B4; color:white; }
    .criterion-list-label { font-size:10px; font-weight:700; color:var(--brown); margin-bottom:7px; }
    .criterion-card { background:#fff; border:1px solid var(--line); border-radius:15px; box-shadow:0 2px 7px #241A1408; overflow:hidden; }
    .criterion-item { min-height:127px; padding:13px 11px 11px; position:relative; }
    .criterion-item + .criterion-item { border-top:1px solid var(--line); }
    .criterion-item .title { display:flex; gap:9px; align-items:center; font-size:13px; font-weight:700; }
    .criterion-icon { width:32px; height:32px; border-radius:50%; background:#EDF3EE; color:var(--sage-dark); display:grid; place-items:center; font-size:15px; flex:0 0 32px; }
    .criterion-item .hint { font-size:10px; color:var(--muted); margin:3px 0 0 41px; }
    .criterion-item .actions { position:absolute; right:9px; top:11px; display:flex; flex-direction:column; gap:5px; }
    .criterion-item .actions span { width:25px; height:25px; border-radius:50%; background:#F6F2EC; display:grid; place-items:center; color:#8D7D68; font-size:13px; }
    .criterion-item .rate { display:flex; align-items:center; gap:5px; margin-top:25px; }
    .criterion-item .rate .stars { font-size:26px; color:var(--sage); letter-spacing:2px; white-space:nowrap; }
    .criterion-item .rate .value { color:var(--muted); font-size:10px; font-weight:700; white-space:nowrap; margin-left:3px; }
    .criterion-item .importance { margin-left:auto; height:33px; border:1px solid #C6D8CA; border-radius:20px; background:#EEF6F0; padding:8px 10px; font-size:10px; font-weight:700; white-space:nowrap; }
    .journal-title { display:flex; align-items:center; justify-content:space-between; margin:17px 0 6px; }
    .journal-title b { font-size:14px; }
    .journal-title span { color:var(--sage-dark); font-size:10px; font-weight:700; }
    .journal-box { min-height:99px; padding:14px 13px; border:1px solid var(--line); border-radius:13px; background:#fff; font-family:ui-serif,Georgia,serif; font-size:13px; line-height:1.35; color:var(--brown); }
    .journal-privacy { color:var(--muted); font-size:10px; font-weight:650; margin-top:8px; }
    .makeagain-title { font-size:14px; font-weight:750; margin:17px 0 8px; }
    .makeagain-pills { display:flex; gap:6px; white-space:nowrap; }
    .makeagain-pills .pill { font-size:10px; padding:8px 9px; }
    .next-time-box { margin-top:12px; }
    .next-time-box .label { margin:0 0 6px; font-size:11px; }
    .next-time-box .field { margin:0; min-height:68px; font-size:12px; line-height:1.35; }
    .keep-row { margin-top:11px; padding:11px 12px; border:1px solid #CADBCF; background:#EDF3EE; border-radius:13px; }
    .keep-row .row-title { font-size:12px; }
    .keep-row .row-sub { font-size:10px; }
    .keep-row .section-link { font-size:11px; }
    .parity-footer { position:absolute; bottom:0; left:0; right:0; height:92px; padding:9px 15px 19px; background:#FAF6F0F2; border-top:1px solid var(--line); }
    .parity-footer .primary { border-radius:30px; height:55px; display:flex; justify-content:space-between; padding:0 19px; }
    .parity-footer .primary small { display:block; font-size:10px; font-weight:500; margin-top:2px; }
    .parity-footer .primary .arrow { font-size:20px; font-weight:400; }
    .review-section-title { display:flex; justify-content:space-between; align-items:center; margin:15px 0 9px; }
    .review-section-title b { font-size:14px; }
    .review-section-title span { color:var(--sage-dark); font-size:11px; font-weight:700; }
    .review-memory { border:1px solid var(--line); border-radius:14px; background:#fff; display:flex; gap:10px; align-items:center; padding:9px; margin-top:12px; }
    .review-memory img { width:48px; height:48px; border-radius:9px; object-fit:cover; }
    .review-score-card { background:#fff; border:1px solid var(--line); border-radius:15px; padding:13px; }
    .review-score-card .score-line { display:flex; justify-content:space-between; align-items:baseline; }
    .review-score-card .score-line b { font-size:13px; }
    .review-score-card .score-line strong { font-size:23px; font-family:ui-serif,Georgia,serif; font-weight:400; }
    .review-score-card .criterion-line { border-top:1px solid var(--line); padding-top:8px; margin-top:9px; font-size:11px; color:var(--brown); }
    .review-selector { display:flex; background:#F1EBE2; border-radius:25px; padding:4px; gap:2px; margin-top:9px; }
    .review-selector span { flex:1; border-radius:22px; text-align:center; padding:8px 0; color:#806F62; font-size:11px; font-weight:700; }
    .review-selector span.on { color:var(--ink); background:#fff; }
    .review-control { padding:13px 12px; border-top:1px solid var(--line); }
    .review-control:first-child { border-top:0; }
    .review-control b { font-size:12px; }
    .review-control p { font-size:10px; color:var(--muted); margin-top:2px; }
    .post-scroll { position:absolute; top:103px; bottom:0; left:0; right:0; overflow-y:auto; padding:0 20px 26px; scrollbar-width:none; }
    .post-scroll::-webkit-scrollbar { display:none; }
    .post-author { display:flex; align-items:center; gap:10px; height:80px; }
    .post-avatar { width:43px; height:43px; border-radius:50%; background:#E5EEE6; color:var(--sage-dark); display:grid; place-items:center; font-size:18px; font-weight:700; }
    .post-author b { font-size:14px; }
    .post-author p { font-size:11px; color:var(--brown); margin-top:2px; }
    .post-hero { position:relative; height:505px; border-radius:20px; overflow:hidden; }
    .post-hero img { width:100%; height:100%; object-fit:cover; }
    .post-hero:after { content:''; position:absolute; inset:55% 0 0; background:linear-gradient(transparent,#1F1712A8); }
    .post-hero .overlay { position:absolute; bottom:22px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:end; z-index:1; color:white; }
    .post-hero .overlay h2 { font-size:25px; max-width:230px; }
    .post-hero .overlay small { display:block; font-size:12px; margin-top:4px; }
    .post-hero .overlay strong { font-family:ui-serif,Georgia,serif; font-size:32px; font-weight:400; }
    .post-content { padding:16px 2px; }
    .post-content .caption { font-size:15px; line-height:1.35; color:var(--brown); }
    .post-evidence { margin-top:17px; border-top:1px solid var(--line); padding-top:14px; }
    .post-evidence .section-label { font-size:12px; }
    .review-control .check { flex:0 0 31px; }

</head>
<body><div id="root"></div><script>
const ASSET='assets/pumpkin-cream-latte.png';
const LATTE='../../../testMugshot/Assets.xcassets/V3CreamyLatte.imageset/v3-creamy-latte.png';
const MUGSY='../../../testMugshot/Assets.xcassets/MugsyNoCafes.imageset/MugsyNoCafes.png';

"><div class="label">Next time <span style="float:right;color:var(--sage-dark)">Private</span></div><div class="field">Maybe a little less foam so the pumpkin comes through.</div></div><div class="keep-row"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="row-title">Keep what worked?</div><div class="row-sub">Pumpkin syrup · 20 g planned → 22 g used</div></div><div class="check">✓</div></div><div class="divider" style="margin:8px 0"></div><div class="section-link">Use 22 g in this latte next time</div></div><div class="journal-privacy">The syrup recipe itself stays unchanged.</div>`:''}</div><div class="parity-footer"><div class="primary"><span>Continue to Review<small>Updated from your rated criteria.</small></span><span class="arrow">→</span></div></div>`);

const reviewParity=(audience)=>screen(`${reviewNav}<div class="parity-scroll review-scroll" style="top:110px"><div class="parity-header"><h1>Review Mugshot</h1><p class="subtitle">Review the memory before it reaches your people.</p></div><div class="review-section-title"><b>Photos</b><span>Edit</span></div><img class="photo-wide" src="${ASSET}" style="height:191px;border-radius:16px"><div style="font-size:14px;font-weight:700;margin-top:10px">Pumpkin Cream Latte</div><div class="small" style="margin-top:3px">Home · September 29, 2026</div><div class="review-memory"><img src="${ASSET}"><div><div class="row-title">Pumpkin Cream Latte</div><div class="row-sub">Home · your recipe</div></div><span class="section-link" style="margin-left:auto">Edit</span></div><div class="review-section-title"><div><b>Caption</b><div class="small">Required · written by you</div></div></div><div class="field" style="font-family:ui-serif,Georgia,serif;line-height:1.3;min-height:72px;color:var(--brown)">A little fall in a glass. The extra pumpkin syrup was it.</div><div class="small" style="text-align:right;margin-top:5px">68 / 1,000</div><div class="review-section-title"><b>Scores &amp; criteria</b><span>Edit</span></div><div class="review-score-card"><div class="score-line"><b>Sip score</b><strong>4.5 ★</strong></div><div class="criterion-line">Sweetness 4.5 · Creaminess 4.5 · Coffee Presence 3.5</div><div class="section-link" style="margin-top:9px">Show all criteria ⌄</div></div><div class="review-section-title"><b>How you made it</b><span>View details</span></div><div class="card pad" style="font-size:11px;line-height:1.5;color:var(--brown)">House espresso · 37.2 g out · 27 sec<br>Pumpkin syrup · 22 g used · Cream cheese foam · as planned</div><div class="card" style="margin-top:16px"><div class="review-control"><b>Audience</b><p>Who can see the finished Mugshot</p><div class="review-selector"><span class="${audience==='Private'?'on':''}" onclick="window.renderScreen('15b-review-private- const postParity=()=>screen(`${status}<div class="top"><div class="round">‹</div><div class="overline" style="font-size:11px">MUGSHOT</div><div class="navcapsule" style="min-width:91px"><span>···</span><span>•••</span></div></div><div class="post-scroll post-detail-scroll"><div class="post-author"><div class="post-avatar">J</div><div><b>Joe</b><p>@joe · Sep 29, 2026 at 6:46 PM</p></div></div><div class="post-hero"><img src="${ASSET}"><div class="overlay"><div><h2>Pumpkin Cream Latte</h2><small>Home</small></div><div style="text-align:right"><strong>4.5</strong><small>OUT OF 5</small></div></div></div><div class="post-content"><p class="caption">A little fall in a glass. The extra pumpkin syrup was it.</p><div class="post-evidence"><div class="overline">JOURNAL NOTE · ONLY YOU</div><p class="serif" style="font-size:16px;line-height:1.35;margin-top:9px">Creamy, cozy, and sweeter in the best way.</p></div><div class="pills" style="margin-top:14px"><span class="pill soft">Make again</span><span class="pill">Share</span><span class="pill">History</span></div><div class="post-evidence"><div class="section-label">Your taste</div><div class="small" style="margin-top:7px">Sip score 4.5 · Sweetness 4.5 · Creaminess 4.5</div></div><div class="post-evidence"><div class="section-label">How you made it</div><div class="card" style="margin-top:10px"><div class="row tight"><span class="row-title">House espresso</span><span class="row-end">37.2 g · 27 sec</span></div><div class="row tight"><span class="row-title">Pumpkin syrup</span><span class="row-end">22 g used</span></div><div class="row tight"><span class="row-title">Cream cheese foam</span><span class="row-end">As planned</span></div></div><div class="section-link" style="margin-top:9px">View full preparation →</div></div></div></div>`);
screens['17-journal-detail']=postParity();
screens['17b-journal-preparation']=postParity();
window.showTweak=function(){window.renderScreen('14-keep-change');};
window.renderScreen=function(name){
  const root=document.getElementById('root');
  root.innerHTML=screens[name]||screens['07-latte-recognition'];
  document.title='Mugshot Home Sip V4 — '+name;
  const sipStars=root.querySelector('.parity-score .stars');
  if(sipStars)sipStars.innerHTML=starRow('4.5');
  if(name.startsWith('15')){
    const captionRule=root.querySelector('.review-section-title .small');
    if(captionRule)captionRule.textContent='Optional · just for your journal';
  }
  if(name==='16-review-friends'){
    const tagRow=root.querySelector('.review-control:last-child');
    tagRow?.insertAdjacentHTML('beforebegin','<div class="review-control"><b>Recipe source and rights</b><p>Attribution stays with the exact recipe version</p><div class="section-link" style="margin-top:8px">My original recipe · save and adapt off</div></div>');
  }
  const scroller=root.querySelector('.reflection-scroll, .review-scroll, .post-detail-scroll');
  if(!scroller)return;
  if(name==='13b-reflection-criteria')scroller.scrollTop=510;
  if(name==='14-keep-change')scroller.scrollTop=scroller.scrollHeight;
  if(name==='15b-review-private-details')scroller.scrollTop=scroller.scrollHeight-scroller.clientHeight-24;
  if(name==='16-review-friends')scroller.scrollTop=scroller.scrollHeight-scroller.clientHeight-15;
  if(name==='17b-journal-preparation')scroller.scrollTop=scroller.scrollHeight;
};
window.renderScreen(new URLSearchParams(location.search).get('screen')||'07-latte-recognition');
