<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mugshot confirmation email design QA</title>
  </head>
  <body style="margin:0;background:#1F1712;color:#FAF6F0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <main style="max-width:1440px;margin:0 auto;padding:40px;">
      <header style="margin-bottom:28px;">
        <p style="margin:0 0 8px;color:#A8CDB8;font-size:13px;font-weight:800;letter-spacing:3px;text-transform:uppercase;">Mugshot auth email</p>
        <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:36px;font-weight:400;">Selected direction and production render</h1>
      </header>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;">
        <section>
          <h2 style="margin:0 0 12px;font-size:15px;">Selected concept</h2>
          <img src="confirm-signup-selected-concept.png" alt="Selected confirmation email concept" style="display:block;width:100%;height:auto;border-radius:20px;">
        </section>
        <section>
          <h2 style="margin:0 0 12px;font-size:15px;">Production-safe HTML</h2>
          <img src="screenshots/confirm-signup-implementation-card.png" alt="Production confirmation email render" style="display:block;width:100%;height:auto;border-radius:20px;">
        </section>
      </div>
    </main>
  </body>
</html>
